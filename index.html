<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapcode</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #53647b;
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 5px 4px;
      background: #fff;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      gap: 16px;
      min-height: calc(100vh - 10px);
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #d9d9d9;
      border-radius: 12px 12px 0 0;
      background: #fff;
    }

    .panel-header {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 19px;
      border-bottom: 1px solid #d9d9d9;
      background: #f1f1f1;
    }

    .panel-title {
      margin: 0;
      color: #53647b;
      font-size: 16px;
      font-weight: 700;
    }

    .right-header {
      justify-content: space-between;
      padding: 0 14px;
    }

    .header-bar {
      display: block;
      height: 22px;
      background: #d0d1d2;
    }

    .header-bar-main { width: 36%; }
    .header-bar-short { width: 14%; height: 14px; }

    .panel-body {
      min-height: calc(100vh - 49px);
      background: #fff;
    }

    @media (max-width: 680px) {
      .content {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(280px, 1fr) minmax(280px, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="content" aria-label="Two-panel layout">
    <section class="panel" aria-label="What's Happening">
      <header class="panel-header">
        <h1 class="panel-title">What's Happening?</h1>
      </header>
      <div class="panel-body"></div>
    </section>

    <section class="panel" aria-label="Second panel">
      <header class="panel-header right-header" aria-hidden="true">
        <span class="header-bar header-bar-main"></span>
        <span class="header-bar header-bar-short"></span>
      </header>
      <div class="panel-body"></div>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A block-based coding platform inspired by Scratch.">
  <title>Snapcode — Block-Based Coding</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101326;
      color: #f7f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 15% 15%, #4838a8 0, transparent 38%), radial-gradient(ellipse at 90% 85%, #087d91 0, transparent 34%), #101326;
    }
    main {
      width: min(760px, 100%);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 28px;
      background: rgb(20 23 48 / 82%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      text-align: center;
    }
    .mark {
      display: inline-grid;
      width: 76px;
      height: 76px;
      place-items: center;
      margin-bottom: 1.25rem;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffbd4a, #ff6a8b 55%, #9b76ff);
      color: #17152a;
      font-size: 2.2rem;
      font-weight: 900;
      transform: rotate(-5deg);
    }
    h1 { margin: 0; font-size: clamp(2.6rem, 9vw, 5rem); letter-spacing: -0.07em; }
    h1 span { color: #a997ff; }
    p { max-width: 520px; margin: 1rem auto 0; color: #c4c6dc; font-size: 1.1rem; line-height: 1.7; }
    .features { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.7rem; margin: 2rem 0; }
    .features span { padding: 0.55rem 0.85rem; border: 1px solid rgb(255 255 255 / 13%); border-radius: 999px; background: rgb(255 255 255 / 6%); color: #e4e3f5; font-size: 0.9rem; }
    .start {
      display: inline-block;
      padding: 0.9rem 1.35rem;
      border-radius: 12px;
      background: #a997ff;
      color: #17152a;
      font-weight: 750;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease;
    }
    .start:hover { transform: translateY(-2px); background: #c0b5ff; }
    .start:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    footer { margin-top: 2rem; color: #9295b2; font-size: 0.85rem; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>Snap<span>code</span></h1>
    <p>Bring your ideas to life, one block at a time. Snapcode is a creative space for exploring code and building something amazing.</p>
    <div class="features" aria-label="What you can do">
      <span>🧩 Build with blocks</span>
      <span>🎨 Get creative</span>
      <span>🚀 Make something yours</span>
    </div>
    <a class="start" href="./editor.html">Start creating</a>
    <footer>Made for curious minds.</footer>
  </main>
</body>
</html>

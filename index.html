<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapcode</title>
  <style>
    :root {
      --page-bg: #f3f4f5;
      --panel-bg: #f7f7f7;
      --border: #d9d9d9;
      --text: #2a3b50;
      --muted: #9aa4af;
      --skeleton: #cfcfcf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      background: var(--page-bg);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      min-height: 100vh;
      padding: 0;
      position: relative;
    }

    .panel + .panel {
      border-left: 1px solid var(--border);
    }

    .panel-header {
      font-size: clamp(1.2rem, 2vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #2b3d57;
      padding: 18px 22px 10px;
      line-height: 1.2;
    }

    .panel-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 20px 20px;
    }

    .skeleton {
      display: block;
      width: 100%;
      height: 18px;
      background: var(--skeleton);
      border-radius: 6px;
      opacity: 0.9;
    }

    .skeleton.short {
      width: 72%;
    }

    .skeleton.large {
      height: 38px;
      border-radius: 8px;
      width: 100%;
    }

    .right-panel {
      padding-top: 18px;
    }

    .right-panel .skeleton:first-child {
      margin-top: 0;
    }

    .placeholder-block {
      height: calc(100vh - 136px);
      border-radius: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
    }

    .placeholder-block .skeleton.large {
      height: 50px;
      background: #d1d1d1;
    }

    @media (max-width: 860px) {
      .content {
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 48vh;
      }

      .panel + .panel {
        border-left: 1px solid var(--border);
        border-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="content" aria-label="Content columns">
      <section class="panel" aria-label="Left column">
        <div class="panel-header">What's Happening?</div>
      </section>

      <section class="panel right-panel" aria-label="Right column">
        <div class="panel-body placeholder-block">
          <div class="skeleton large"></div>
          <div class="skeleton large"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>

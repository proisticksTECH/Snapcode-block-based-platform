<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Snapcode — create programs with visual blocks.">
  <title>Snapcode Editor</title>
  <script src="https://unpkg.com/blockly@11.2.2/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@11.2.2/blocks.min.js"></script>
  <script src="https://unpkg.com/blockly@11.2.2/javascript.min.js"></script>
  <script src="https://unpkg.com/blockly@11.2.2/msg/en.js"></script>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20233a;
      background: #f5f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      height: 66px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      background: #fff;
      border-bottom: 1px solid #e6e8f0;
    }
    .brand { color: #5b4bdb; font-size: 1.35rem; font-weight: 850; text-decoration: none; letter-spacing: -0.04em; }
    .project-name { color: #70748a; font-size: 0.95rem; }
    .spacer { flex: 1; }
    button, .preview {
      border: 0;
      border-radius: 10px;
      padding: 10px 17px;
      color: #fff;
      background: #5b4bdb;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, .preview:hover { background: #4939c3; }
    button:focus-visible, a:focus-visible { outline: 3px solid #ffbd4a; outline-offset: 3px; }
    .run { background: #20a66a; }
    .run:hover { background: #168653; }
    .preview { background: #ff9f43; color: #2a1900; }
    .preview:hover { background: #ffb267; }
    main { padding: 18px; }
    .workspace-wrap {
      height: min(74vh, 680px);
      min-height: 360px;
      overflow: hidden;
      border: 1px solid #e2e4ed;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 26px rgb(35 39 70 / 7%);
    }
    #blocklyDiv { width: 100%; height: 100%; }
    .bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 360px);
      gap: 16px;
      margin-top: 16px;
    }
    .panel {
      min-height: 118px;
      padding: 16px 18px;
      border: 1px solid #e2e4ed;
      border-radius: 14px;
      background: #fff;
    }
    .panel h2 { margin: 0 0 8px; font-size: 0.95rem; }
    #output { min-height: 42px; color: #646980; white-space: pre-wrap; overflow-wrap: anywhere; }
    #code { max-height: 100px; overflow: auto; margin: 0; color: #62677c; font: 0.78rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    @media (max-width: 700px) {
      header { gap: 10px; padding: 0 12px; }
      .project-name { display: none; }
      main { padding: 10px; }
      .workspace-wrap { height: 64vh; min-height: 340px; }
      .bottom { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./index.html">Snapcode</a>
    <span class="project-name">My Project</span>
    <span class="spacer"></span>
    <a class="preview" id="seeProject" href="./projectpage.html">See Project</a>
    <button class="run" id="runButton" type="button">▶ Run</button>
  </header>
  <main>
    <div class="workspace-wrap"><div id="blocklyDiv" aria-label="Snapcode block editor"></div></div>
    <section class="bottom" aria-label="Program output and generated code">
      <div class="panel"><h2>Output</h2><div id="output" role="status" aria-live="polite">Press Run to see what your blocks do.</div></div>
      <div class="panel"><h2>Generated code</h2><pre id="code">Add blocks to get started.</pre></div>
    </section>
  </main>
  <xml id="toolbox" style="display:none">
    <category name="Logic" categorystyle="logic_category">
      <block type="controls_if"></block><block type="logic_compare"></block>
      <block type="logic_operation"></block><block type="logic_boolean"></block>
      <block type="logic_negate"></block>
    </category>
    <category name="Loops" categorystyle="loop_category">
      <block type="controls_repeat_ext"><value name="TIMES"><shadow type="math_number"><field name="NUM">5</field></shadow></value></block>
      <block type="controls_whileUntil"></block><block type="controls_for"></block>
    </category>
    <category name="Math" categorystyle="math_category">
      <block type="math_number"></block><block type="math_arithmetic"></block>
      <block type="math_single"></block><block type="math_random_int"></block>
    </category>
    <category name="Text" categorystyle="text_category">
      <block type="text"></block><block type="text_print"></block><block type="text_join"></block>
    </category>
    <category name="Lists" categorystyle="list_category">
      <block type="lists_create_with"></block><block type="lists_length"></block>
      <block type="lists_getIndex"></block>
    </category>
    <category name="Variables" custom="VARIABLE" categorystyle="variable_category"></category>
    <category name="Functions" custom="PROCEDURE" categorystyle="procedure_category"></category>
  </xml>
  <script>
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      grid: {spacing: 20, length: 3, colour: '#dddff0', snap: true},
      zoom: {controls: true, wheel: true, startScale: 0.95, maxScale: 1.5, minScale: 0.55},
      move: {scrollbars: true, drag: true, wheel: true}
    });

    const output = document.getElementById('output');
    const codePanel = document.getElementById('code');
    const generator = javascript.javascriptGenerator;
    const projectStorageKey = 'snapcode-project-preview';

    function updateCode() {
      const code = generator.workspaceToCode(workspace);
      codePanel.textContent = code || 'Add blocks to get started.';
      try {
        localStorage.setItem(projectStorageKey, JSON.stringify({
          name: 'My Project',
          code: code
        }));
      } catch (error) {
        // The editor remains usable if browser storage is unavailable.
      }
    }
    workspace.addChangeListener(updateCode);

    document.getElementById('runButton').addEventListener('click', () => {
      const code = generator.workspaceToCode(workspace);
      const lines = [];
      const print = value => lines.push(String(value));
      try {
        new Function('alert', code)(print);
        output.textContent = lines.join('\n') || 'Done! Your program ran successfully.';
      } catch (error) {
        output.textContent = `Program error: ${error.message}`;
      }
    });

    document.getElementById('seeProject').addEventListener('click', () => {
      updateCode();
    });

    const starter = workspace.newBlock('text_print');
    const message = workspace.newBlock('text');
    message.setFieldValue('Hello from Snapcode!', 'TEXT');
    starter.getInput('TEXT').connection.connect(message.outputConnection);
    starter.initSvg();
    message.initSvg();
    starter.render();
    message.render();
    starter.moveBy(40, 40);
    updateCode();
  </script>
</body>
</html>

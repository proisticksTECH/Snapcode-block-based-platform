<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home-snapcode</title>
  <style>
    :root {
      --page-bg: #f3f3f4;
      --panel-bg: #f6f6f6;
      --border: #d8d8d8;
      --text: #2d3d58;
      --skeleton: #d0d0d0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      background: var(--page-bg);
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      min-height: 100vh;
      position: relative;
    }

    .panel + .panel {
      border-left: 1px solid var(--border);
    }

    .left-title {
      padding: 18px 22px 0;
      font-weight: 800;
      font-size: clamp(1.8rem, 2vw, 2.5rem);
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .right {
      padding: 18px 18px 0;
    }

    .ghost-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .ghost {
      background: var(--skeleton);
      border-radius: 6px;
      height: 18px;
      width: 100%;
    }

    .ghost.top {
      width: 78%;
      height: 20px;
      margin-top: 4px;
    }

    .ghost.bottom {
      width: 100%;
      height: 54px;
      margin-top: 2px;
    }

    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="panel">
      <div class="left-title">What's Happening?</div>
    </div>

    <div class="panel right">
      <div class="ghost-stack">
        <div class="ghost top"></div>
        <div class="ghost bottom"></div>
      </div>
    </div>
  </div>
</body>
</html>
